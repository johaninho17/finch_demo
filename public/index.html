<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finch Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="p-4 bg-light">
    <div class="container" style="max-width: 1000px;">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <h3 class="fw-bold mb-0">Finch Demo Dashboard</h3>
            <div>
                <button id="btnConnect" class="btn btn-primary fw-bold">Finch Connect</button>
            </div>
        </div>

        <!-- Alert Banner -->
        <div id="errorAlert" class="alert alert-danger d-none mb-4" role="alert">
            <span id="errorMessage"></span>
        </div>

        <!-- Company Data -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-dark text-white fw-bold">Company Information</div>
            <div class="card-body">
                <div class="row g-3" id="companyFields">
                    <div class="col-12 text-muted">Connect a provider to load company data.</div>
                </div>
            </div>
        </div>

        <!-- Directory & Individual Details -->
        <div class="row g-4">
            <!-- Directory Column -->
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white fw-bold">Directory</div>
                    <div class="list-group list-group-flush" id="directoryList">
                        <div class="p-3 text-muted">No individuals loaded.</div>
                    </div>
                </div>
            </div>

            <!-- Individual Details Column -->
            <div class="col-md-7">
                <div class="card mb-4 shadow-sm">
                    <div class="card-header bg-secondary text-white fw-bold">Individual Data</div>
                    <div class="card-body">
                        <div class="row g-3" id="individualFields">
                            <div class="col-12 text-muted">Select an Individual from directory.</div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white fw-bold">Employment Data</div>
                    <div class="card-body">
                        <div class="row g-3" id="employmentFields">
                            <div class="col-12 text-muted">Select an Individual from directory.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>

</html>
